[workspace]
resolver = "2"
members = ["examples", "mania", "mania-codec", "mania-core", "mania-macros"]

[workspace.package]
version = "0.0.2"
edition = "2024"
license-file = "LICENCE"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.102"
arc-swap = { version = "1.8.2", features = ["serde"] }
byteorder = "1.5.0"
bytes = { version = "1.11.1", features = ["serde"] }
cfg-if = "1.0.4"
chrono = { version = "0.4.44", features = ["serde"] }
console-subscriber = "0.5.0"
dashmap = "7.0.0-rc2"
digest = "0.11.1"
elliptic-curve = "0.14.0-rc.29"
flate2 = "1.1.9"
futures = "0.3.32"
generic-array = "1.3.5"
glob = "0.3.3"
hex = "0.4.3"
image = "0.25.10"
inventory = "0.3.22"
mania = { path = "mania" }
mania-codec = { path = "mania-codec" }
mania-core = { path = "mania-core" }
mania-macros = { path = "mania-macros" }
md-5 = "0.11.0-rc.5"
noise = "0.9.0"
num-traits = "0.2.19"
num_enum = "0.7.5"
once_cell = "1.21.4"
p256 = { version = "0.14.0-rc.8", features = ["ecdh"] }
phf = { version = "0.13.1", features = ["macros"] }
proc-macro2 = "1.0.106"
prost = "0.14.3"
prost-build = "0.14.3"
quick-xml = { version = "0.39.2", features = ["serialize"] }
quote = "1.0.45"
rand = "0.10.0"
rand_chacha = "0.10.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["query", "form"] }
rubato = "0.16.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.11.0-rc.5"
silk-sys = "0.1.0"
surge-ping = "0.8.4"
symphonia = { git = "https://github.com/pdeljanov/Symphonia.git", rev = "c7efbcb0", features = ["all"] }
syn = { version = "2.0.117", features = ["full"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["fs", "net", "io-util", "time", "macros", "rt-multi-thread", "signal", "tracing", "sync"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.22.0", features = ["serde", "v4"] }

[profile.release]
lto = true
incremental = false
codegen-units = 1
strip = true
